<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>{{APP_NAME}}</title>
<!--
  Baseline structure only. For every app, replace this with a bespoke design in
  <project>/app-sync/chrome/offline.html (see references/premium-chrome.md).
  Keep: the tokens, the retry logic, the credit footer, zero network assets.
-->
<style>
  :root {
    --bg: {{BG}};
    --ink: {{INK}};
    --primary: {{PRIMARY}};
    --accent: {{ACCENT}};
    --muted: color-mix(in oklab, var(--ink) 62%, var(--bg));
    --hair: color-mix(in oklab, var(--ink) 14%, transparent);
    --glow: color-mix(in oklab, var(--primary) 55%, transparent);
    --face: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", "Avenir Next", "Noto Sans", system-ui, sans-serif;
    --text: "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "Avenir Next", "Noto Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: color-mix(in oklab, {{INK}} 94%, {{PRIMARY}} 6%);
      --ink: {{BG}};
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120vmax 90vmax at 12% -10%, color-mix(in oklab, var(--primary) 34%, transparent), transparent 62%),
      radial-gradient(90vmax 70vmax at 110% 115%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 60%),
      var(--bg);
    color: var(--ink);
    font: 400 16px/1.55 var(--text);
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    overflow: hidden;
  }
  body::after { /* fine grain so large gradients never band */
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  main { align-self: center; justify-self: center; width: min(440px, 100%); text-align: center; }
  .mark { position: relative; width: 132px; height: 132px; margin: 0 auto 36px; display: grid; place-items: center; }
  .mark span {
    position: relative; z-index: 1; width: 76px; height: 76px; border-radius: 26px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--primary), color-mix(in oklab, var(--primary) 55%, var(--accent)));
    color: #fff; font: 650 34px/1 var(--face); letter-spacing: -.02em;
    box-shadow: 0 18px 40px -12px var(--glow), inset 0 1px 0 color-mix(in oklab, #fff 35%, transparent);
  }
  .mark i { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--hair); }
  .mark i:nth-child(2) { inset: 16px; }
  body[data-state="waiting"] .mark i { animation: ring 2.8s cubic-bezier(.2,.7,.2,1) infinite; }
  body[data-state="waiting"] .mark i:nth-child(2) { animation-delay: 1.4s; }
  @keyframes ring { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
  h1 { font: 620 clamp(26px, 6vw, 32px)/1.15 var(--face); letter-spacing: -.022em; margin-bottom: 12px; }
  p.lead { color: var(--muted); max-width: 34ch; margin: 0 auto 32px; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    appearance: none; border: 0; cursor: pointer; font: 600 15px/1 var(--text);
    padding: 15px 26px; border-radius: 999px; color: #fff;
    background: linear-gradient(180deg, color-mix(in oklab, var(--primary) 88%, #fff), var(--primary));
    box-shadow: 0 10px 24px -10px var(--glow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 14px 30px -10px var(--glow); }
  button:active { transform: translateY(0); }
  button[disabled] { opacity: .6; cursor: progress; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .status { margin-top: 18px; min-height: 1.5em; font-size: 14px; color: var(--muted); }
  footer { padding: 20px 0 18px; text-align: center; font-size: 13px; color: var(--muted); }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--hair); padding-bottom: 1px; }
  footer a:hover { border-bottom-color: var(--accent); }
  footer small { display: block; margin-top: 4px; font-size: 12px; opacity: .75; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-state="offline">
<main>
  <div class="mark" aria-hidden="true"><i></i><i></i><span>{{APP_INITIAL}}</span></div>
  <h1>You're offline</h1>
  <p class="lead">{{APP_NAME}} needs an internet connection. Your work is safe; it will reopen right where it was once you're back online.</p>
  <div class="actions"><button id="retry" type="button">Try again</button></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>
<footer>
  {{CREDIT_LEAD}} <a id="credit" href="{{CREDIT_URL}}" target="_blank" rel="noopener">{{CREDIT_NAME}}</a>
  <small>{{APP_NAME}} {{VERSION}}</small>
</footer>
<script>
(function () {
  var LIVE = "{{LIVE_URL}}";
  var body = document.body, btn = document.getElementById("retry"), status = document.getElementById("status");
  function reach(ms) {
    if (!LIVE) return Promise.resolve(navigator.onLine);
    var ctl = "AbortController" in window ? new AbortController() : null;
    var t = setTimeout(function () { ctl && ctl.abort(); }, ms);
    return fetch(LIVE, { mode: "no-cors", cache: "no-store", signal: ctl && ctl.signal })
      .then(function () { return true; }, function () { return false; })
      .finally(function () { clearTimeout(t); });
  }
  function retry() {
    body.dataset.state = "waiting"; btn.disabled = true; status.textContent = "Checking your connection…";
    reach(7000).then(function (ok) {
      if (ok) { status.textContent = "Connected. Opening " + document.title + "…"; location.replace(LIVE || "index.html"); return; }
      body.dataset.state = "offline"; btn.disabled = false;
      status.textContent = "Still no connection. This page retries on its own when the network returns.";
    });
  }
  btn.addEventListener("click", retry);
  window.addEventListener("online", retry);
  document.getElementById("credit").addEventListener("click", function (e) {
    var t = window.__TAURI__;
    if (t && t.opener && t.opener.openUrl) { e.preventDefault(); t.opener.openUrl(this.href); }
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>{{APP_NAME}}</title>
<!--
  Boot page for live mode. Checks for a native shell update (desktop), checks the
  connection, then hands the window to the live web app. Baseline structure only:
  restyle it per app in <project>/app-sync/chrome/boot.html.
-->
<style>
  :root {
    --bg: {{BG}}; --ink: {{INK}}; --primary: {{PRIMARY}}; --accent: {{ACCENT}};
    --muted: color-mix(in oklab, var(--ink) 62%, var(--bg));
    --hair: color-mix(in oklab, var(--ink) 14%, transparent);
    --glow: color-mix(in oklab, var(--primary) 55%, transparent);
    --face: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", "Avenir Next", "Noto Sans", system-ui, sans-serif;
    --text: "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "Avenir Next", "Noto Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: color-mix(in oklab, {{INK}} 94%, {{PRIMARY}} 6%); --ink: {{BG}}; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120vmax 90vmax at 12% -10%, color-mix(in oklab, var(--primary) 34%, transparent), transparent 62%),
      radial-gradient(90vmax 70vmax at 110% 115%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 60%),
      var(--bg);
    color: var(--ink); font: 400 16px/1.55 var(--text); -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: 1fr auto; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default;
  }
  main { align-self: center; justify-self: center; width: min(440px, 100%); text-align: center; }
  .mark { position: relative; width: 132px; height: 132px; margin: 0 auto 36px; display: grid; place-items: center; }
  .mark span {
    position: relative; z-index: 1; width: 76px; height: 76px; border-radius: 26px; display: grid; place-items: center;
    background: linear-gradient(145deg, var(--primary), color-mix(in oklab, var(--primary) 55%, var(--accent)));
    color: #fff; font: 650 34px/1 var(--face); letter-spacing: -.02em;
    box-shadow: 0 18px 40px -12px var(--glow), inset 0 1px 0 color-mix(in oklab, #fff 35%, transparent);
  }
  .mark i { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--hair); }
  .mark i:nth-child(2) { inset: 16px; }
  body[data-state="connecting"] .mark i { animation: ring 2.8s cubic-bezier(.2,.7,.2,1) infinite; }
  body[data-state="connecting"] .mark i:nth-child(2) { animation-delay: 1.4s; }
  @keyframes ring { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
  h1 { font: 620 clamp(26px, 6vw, 32px)/1.15 var(--face); letter-spacing: -.022em; margin-bottom: 12px; }
  p.lead { color: var(--muted); max-width: 34ch; margin: 0 auto 32px; min-height: 3.1em; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; min-height: 46px; }
  button {
    appearance: none; border: 0; cursor: pointer; font: 600 15px/1 var(--text); padding: 15px 26px; border-radius: 999px;
    color: #fff; background: linear-gradient(180deg, color-mix(in oklab, var(--primary) 88%, #fff), var(--primary));
    box-shadow: 0 10px 24px -10px var(--glow); transition: transform .15s ease, box-shadow .15s ease;
  }
  button.quiet { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
  button:hover { transform: translateY(-1px); }
  button[disabled] { opacity: .6; cursor: progress; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .bar { height: 3px; width: min(220px, 60%); margin: 22px auto 0; border-radius: 3px; background: var(--hair); overflow: hidden; visibility: hidden; }
  .bar b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .2s ease; }
  body[data-state="updating"] .bar { visibility: visible; }
  [hidden] { display: none !important; }
  footer { padding: 20px 0 18px; text-align: center; font-size: 13px; color: var(--muted); }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--hair); padding-bottom: 1px; }
  footer a:hover { border-bottom-color: var(--accent); }
  footer small { display: block; margin-top: 4px; font-size: 12px; opacity: .75; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-state="connecting">
<main>
  <div class="mark" aria-hidden="true"><i></i><i></i><span>{{APP_INITIAL}}</span></div>
  <h1 id="title">{{APP_NAME}}</h1>
  <p class="lead" id="lead">{{TAGLINE}}</p>
  <div class="actions">
    <button id="primary" type="button" hidden></button>
    <button id="secondary" class="quiet" type="button" hidden></button>
  </div>
  <div class="bar" aria-hidden="true"><b id="progress"></b></div>
  <p class="lead" id="status" role="status" aria-live="polite" style="margin:18px auto 0;min-height:1.5em;font-size:14px"></p>
</main>
<footer>
  {{CREDIT_LEAD}} <a id="credit" href="{{CREDIT_URL}}" target="_blank" rel="noopener">{{CREDIT_NAME}}</a>
  <small>{{APP_NAME}} {{VERSION}}</small>
</footer>
<script>
(function () {
  var LIVE = "{{LIVE_URL}}";
  var T = window.__TAURI__ || null;
  var $ = function (id) { return document.getElementById(id); };
  var body = document.body;

  function view(state, title, lead, primary, secondary) {
    body.dataset.state = state;
    if (title) $("title").textContent = title;
    $("lead").textContent = lead || "";
    [["primary", primary], ["secondary", secondary]].forEach(function (p) {
      var b = $(p[0]);
      if (!p[1]) { b.hidden = true; b.onclick = null; return; }
      b.hidden = false; b.disabled = false; b.textContent = p[1].label; b.onclick = p[1].run;
    });
  }
  function status(t) { $("status").textContent = t || ""; }

  function reach(ms) {
    var ctl = "AbortController" in window ? new AbortController() : null;
    var timer = setTimeout(function () { ctl && ctl.abort(); }, ms);
    return fetch(LIVE, { mode: "no-cors", cache: "no-store", signal: ctl && ctl.signal })
      .then(function () { return true; }, function () { return false; })
      .finally(function () { clearTimeout(timer); });
  }

  function offline() {
    view("offline", "You're offline",
      "{{APP_NAME}} needs an internet connection. Everything you saved is safe and will be here when you reconnect.",
      { label: "Try again", run: go });
    status("Retries on its own when the network returns.");
  }

  function go() {
    view("connecting", "{{APP_NAME}}", "{{TAGLINE}}");
    status("Connecting…");
    if (!navigator.onLine) return offline();
    reach(8000).then(function (ok) {
      if (!ok) return offline();
      status("");
      location.replace(LIVE);
    });
  }

  function checkShellUpdate() {
    // Desktop only: the native shell updates itself through signed releases.
    if (!T || !T.updater || !T.updater.check) return Promise.resolve(null);
    var timeout = new Promise(function (r) { setTimeout(function () { r(null); }, 4000); });
    return Promise.race([T.updater.check().catch(function () { return null; }), timeout]);
  }

  function offerUpdate(update) {
    view("update", "A new version is ready",
      "Version " + update.version + " of {{APP_NAME}} is ready to install. It takes a few seconds and restarts the app.",
      { label: "Install and restart", run: function () { install(update); } },
      { label: "Later", run: go });
  }

  function install(update) {
    view("updating", "Installing version " + update.version, "Keep the app open until it restarts.");
    var total = 0, got = 0;
    update.downloadAndInstall(function (ev) {
      if (ev.event === "Started") total = (ev.data && ev.data.contentLength) || 0;
      if (ev.event === "Progress") { got += (ev.data && ev.data.chunkLength) || 0; if (total) $("progress").style.width = Math.min(100, got * 100 / total) + "%"; }
      if (ev.event === "Finished") $("progress").style.width = "100%";
    }).then(function () {
      status("Restarting…");
      return T.process && T.process.relaunch ? T.process.relaunch() : go();
    }).catch(function () {
      view("offline", "Update didn't install", "The download was interrupted. Your current version still works.",
        { label: "Continue", run: go }, { label: "Try the update again", run: function () { install(update); } });
    });
  }

  window.addEventListener("online", function () { if (body.dataset.state === "offline") go(); });
  $("credit").addEventListener("click", function (e) {
    if (T && T.opener && T.opener.openUrl) { e.preventDefault(); T.opener.openUrl(this.href); }
  });

  checkShellUpdate().then(function (u) { return u ? offerUpdate(u) : go(); }, go);
})();
</script>
</body>
</html>

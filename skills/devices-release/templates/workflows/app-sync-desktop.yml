name: Desktop release

# Builds signed Windows, macOS and Linux installers plus the updater manifest
# (latest.json) as a draft GitHub release. Publish the draft to roll it out:
# installed apps pick it up from releases/latest.
#
# Triggers: a `v1.2.3` tag (all platforms), a `desktop-v1.2.3` tag (desktop only),
# a manual run, or a call from app-sync-web-update.yml when desktop is bundled.

on:
  push:
    tags: ["v*", "desktop-v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: write

env:
  DESKTOP_DIR: "{{DESKTOP_PATH}}"
  WEB_ROOT: "{{WEB_ROOT}}"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.DESKTOP_DIR }}/src-tauri -> target"

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install web dependencies
        shell: bash
        working-directory: ${{ env.WEB_ROOT }}
        run: if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi

      - name: Put the web app (or boot page) into the shell
        shell: bash
        run: python3 app-sync/tools/sync_web.py --platform desktop

      - name: Check versions match
        shell: bash
        run: python3 app-sync/tools/sync_versions.py --check

      - name: Install desktop tooling
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing + notarization (leave unset to build unsigned)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ${{ env.DESKTOP_DIR }}
          tagName: app-v__VERSION__
          releaseName: "{{APP_NAME}} __VERSION__"
          releaseBody: "Desktop release of {{APP_NAME}} __VERSION__."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  record:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record the desktop release
        run: |
          python3 app-sync/tools/record_release.py --platform desktop
          git config user.name "app-sync"
          git config user.email "app-sync@users.noreply.github.com"
          git add app-sync.json
          git diff --cached --quiet || git commit -m "chore(app-sync): record desktop release"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

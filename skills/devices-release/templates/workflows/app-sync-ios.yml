name: iOS release

# Archives the iOS app with Xcode 26+, signs it for the App Store, and uploads
# it to TestFlight. Submit for review from App Store Connect.
# Triggers: a `v1.2.3` tag (all platforms), an `ios-v1.2.3` tag, or a manual run.

on:
  push:
    tags: ["v*", "ios-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  MOBILE_DIR: "{{MOBILE_PATH}}"
  WEB_ROOT: "{{WEB_ROOT}}"
  APP_ID: "{{APP_ID}}"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Confirm Xcode meets the App Store floor
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk '/Xcode/{split($2,a,"."); print a[1]}')
          if [ "$major" -lt 26 ]; then echo "::error::App Store uploads need Xcode 26 or later"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install web dependencies
        working-directory: ${{ env.WEB_ROOT }}
        run: if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi

      - name: Install mobile tooling
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm ci

      - name: Build web app and sync the iOS project
        run: python3 app-sync/tools/sync_web.py --platform ios --cap-sync

      - name: Check parity before shipping
        run: python3 app-sync/tools/parity_check.py

      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: ${{ env.APP_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Archive and export
        working-directory: ${{ env.MOBILE_DIR }}/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${APP_ID}</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          ls "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

  record:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record the iOS release
        run: |
          python3 app-sync/tools/record_release.py --platform ios
          git config user.name "app-sync"
          git config user.email "app-sync@users.noreply.github.com"
          git add app-sync.json
          git diff --cached --quiet || git commit -m "chore(app-sync): record ios release"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
